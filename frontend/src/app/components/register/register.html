<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
  <div class="card p-4" style="width: 100%; max-width: 400px;">
    <h2 class="mb-3 text-center">Register</h2>

    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" class="form-control" [(ngModel)]="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" [(ngModel)]="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="fa-solid fa-user-plus"></i> Register
      </button>
    </form>

    <p *ngIf="errorMessage" class="text-danger mt-3">{{ errorMessage }}</p>

    <a routerLink="/login" class="d-block text-center mt-3">Already have an account? Login</a>
  </div>
</div>
