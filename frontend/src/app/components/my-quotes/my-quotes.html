<div class="my-quotes-container">
  <h2>My Quotes</h2>

  <form (ngSubmit)="addQuote()">
    <input type="text" [(ngModel)]="newText" name="newText" placeholder="Quote text" required>
    <input type="text" [(ngModel)]="newAuthor" name="newAuthor" placeholder="Author" required>
    <button type="submit">Add Quote</button>
  </form>

  <ul>
    <li *ngFor="let quote of quotes">
      <div *ngIf="editingId !== quote.id">
        "{{ quote.text }}" — {{ quote.author }}
        <button (click)="startEdit(quote)">Edit</button>
        <button (click)="deleteQuote(quote.id)">Delete</button>
      </div>

      <div *ngIf="editingId === quote.id">
        <input type="text" [(ngModel)]="editText" name="editText{{ quote.id }}">
        <input type="text" [(ngModel)]="editAuthor" name="editAuthor{{ quote.id }}">
        <button (click)="saveEdit(quote.id)">Save</button>
        <button (click)="cancelEdit()">Cancel</button>
      </div>
    </li>
  </ul>
</div>
