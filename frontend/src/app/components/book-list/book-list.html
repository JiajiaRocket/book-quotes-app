<div class="container mt-4">
  <h2 class="mb-4"><i class="fa-solid fa-book"></i> Books</h2>

  <form (ngSubmit)="addBook()" class="row g-2 mb-4">
    <div class="col-md-4">
      <input type="text" class="form-control" [(ngModel)]="newTitle" name="newTitle" placeholder="Title" required>
    </div>
    <div class="col-md-3">
      <input type="text" class="form-control" [(ngModel)]="newAuthor" name="newAuthor" placeholder="Author" required>
    </div>
    <div class="col-md-3">
      <input type="date" class="form-control" [(ngModel)]="newPublishedDate" name="newPublishedDate" required>
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-primary w-100">
        <i class="fa-solid fa-plus"></i> Add Book
      </button>
    </div>
  </form>

  <ul class="list-group">
    <li class="list-group-item" *ngFor="let book of books">
      <div *ngIf="editingId !== book.id" class="d-flex justify-content-between align-items-center">
        <span>
          <strong>{{ book.title }}</strong> — {{ book.author }} ({{ book.publishedDate }})
        </span>
        <span>
          <button class="btn btn-sm btn-warning me-2" (click)="startEdit(book)">
            <i class="fa-solid fa-pen"></i> Edit
          </button>
          <button class="btn btn-sm btn-danger" (click)="deleteBook(book.id)">
            <i class="fa-solid fa-trash"></i> Delete
          </button>
        </span>
      </div>

      <div *ngIf="editingId === book.id" class="row g-2 align-items-center">
        <div class="col-md-4">
          <input type="text" class="form-control" [(ngModel)]="editTitle" name="editTitle{{ book.id }}">
        </div>
        <div class="col-md-3">
          <input type="text" class="form-control" [(ngModel)]="editAuthor" name="editAuthor{{ book.id }}">
        </div>
        <div class="col-md-3">
          <input type="date" class="form-control" [(ngModel)]="editPublishedDate" name="editPublishedDate{{ book.id }}">
        </div>
        <div class="col-md-2">
          <button class="btn btn-sm btn-success me-2" (click)="saveEdit(book.id)">
            <i class="fa-solid fa-check"></i> Save
          </button>
          <button class="btn btn-sm btn-secondary" (click)="cancelEdit()">
            <i class="fa-solid fa-xmark"></i> Cancel
          </button>
        </div>
      </div>
    </li>
  </ul>
</div>
